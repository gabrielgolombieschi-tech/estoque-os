termos_ambiguos_pendentes:
  - termo: "CAIXA"
    status: pendente
    observacao: "Não tratar automaticamente como painel, armário, gabinete ou quadro."
  - termo: "ARMÁRIO"
    status: pendente
    observacao: "Exigir evidência de tipo construtivo e aplicação antes de equivaler a gabinete ou painel."
  - termo: "GABINETE"
    status: pendente
    observacao: "Exigir evidência de aplicação antes de equivaler a armário ou painel."
  - termo: "PAINEL"
    status: pendente
    observacao: "Pode indicar conjunto montado, invólucro ou contexto de aplicação; validar caso a caso."
  - termo: "5SL1"
    status: pendente
    observacao: "Capacidade de interrupção não confirmada para os registros legados desta série; não incluí-la no nome até validação documental."

