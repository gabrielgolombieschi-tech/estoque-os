      - "Transformadores de comando"
      - "Proteção e seccionamento > Chaves seccionadoras"
      - "Proteção e seccionamento > Acessórios para chaves seccionadoras"
      - "Relés e monitoramento > Relés temporizadores"
      - "Relés e monitoramento > Relés de monitoramento de rede"
    regras:
      - "Usar PENTE, e não PONTE, para acessórios de ligação entre bornes. Declarar polos, seção e andares somente quando confirmados."
      - "Bornes de passagem e de proteção são separados pela função; o atributo PLUG-IN permanece no nome quando confirmado."
