versao_padrao: "1.13.0"
fonte_de_verdade: true
familia_material:
  codigo: PAINEIS_ELETRICOS_E_COMPONENTES
  nome: "Painéis elétricos e componentes"
  escopo_inicial: "Acessórios de disjuntores caixa moldada e disjuntores mini"

campos_erp:
  nome_padronizado: itens.nome
  codigo_origem_nota: itens.codigo_interno
  fabricante: itens.fabricante
  fornecedor_origem: itens.fornecedor_id
  grupo_controlado: itens.grupo_id
  descricao_complementar: itens.descricao
  modelo:
    campo_proprio_existente: false
    regra: "Não presumir modelo. Série/modelo só permanece no nome quando representar compatibilidade técnica indispensável e houver aprovação humana."

tipos_tecnicos_aceitos:
  - codigo: ACESSORIO_DISJUNTOR_CAIXA_MOLDADA
    nome: "Acessório para disjuntor caixa moldada"
    subtipos_iniciais:
      - ACIONAMENTO_ROTATIVO_LATERAL
  - codigo: DISJUNTOR_MINI
    nome: "Disjuntor mini"
    atributos_obrigatorios:
      - polos
      - curva
      - corrente_nominal
    atributos_condicionais:
      - capacidade_interrupcao
  - codigo: ACESSORIO_DISJUNTOR_MINI
    nome: "Acessório para disjuntor mini"
    subtipos_iniciais:
      - BLOCO_DISTRIBUICAO
      - BARRAMENTO_DISPOSITIVOS_MODULARES
      - BORNE_BARRAMENTO
    atributos_por_subtipo:
      BLOCO_DISTRIBUICAO: [polos, corrente_nominal, tensao_nominal]
      BARRAMENTO_DISPOSITIVOS_MODULARES: [polos, corrente_nominal, comprimento]
      BORNE_BARRAMENTO: [posicao_montagem, corrente_nominal, tensao_nominal]
  - codigo: BOTAO_COMANDO
    nome: "Botão de comando"
    subtipos_iniciais:
      - PULSADOR
      - BOTAO_EMERGENCIA
      - CHAVE_SELETORA
      - MANOPLA_SELETORA
    atributos_condicionais:
      - contatos
      - iluminado
      - tensao_iluminacao
      - cor
      - material
      - diametro
      - numero_posicoes
      - retorno
  - codigo: BOTOEIRA_CAIXA_COMANDO
    nome: "Botoeira ou caixa de comando"
  - codigo: SINALEIRO
    nome: "Sinaleiro"
  - codigo: BLOCO_CONTATO_BOTAO
    nome: "Bloco de contato para botão"
  - codigo: MODULO_LED_BOTAO
    nome: "Módulo LED para botão"
  - codigo: ACESSORIO_BOTAO
    nome: "Acessório para botão"
  - codigo: CONTATOR
    nome: "Contator"
    atributos_condicionais:
      - polos
      - categoria_utilizacao
      - corrente_nominal
      - contatos_auxiliares
      - tensao_comando
      - frequencia
      - tipo_conexao
  - codigo: CONTATOR_AUXILIAR
    nome: "Contator auxiliar"
  - codigo: ACESSORIO_CONTATOR
    nome: "Acessório para contator"
  - codigo: DISJUNTOR_MOTOR
    nome: "Disjuntor motor"
    atributos_condicionais:
      - faixa_ajuste_corrente
      - corrente_nominal
      - polos
      - tipo_conexao
  - codigo: ACESSORIO_DISJUNTOR_MOTOR
    nome: "Acessório para disjuntor motor"
  - codigo: CONEXAO_PARTIDA_MOTOR
    nome: "Conexão para partida de motor"
  - codigo: RELE_SOBRECARGA
    nome: "Relé de sobrecarga"
    atributos_condicionais:
      - faixa_ajuste_corrente
      - tamanho_construtivo
  - codigo: ACESSORIO_RELE_SOBRECARGA
    nome: "Acessório para relé de sobrecarga"
  - codigo: CHAVE_SECCIONADORA
    nome: "Chave seccionadora"
    atributos_condicionais: [tipo_construtivo, polos, corrente_nominal, tensao_nominal, tipo_montagem]
  - codigo: FUSIVEL_NH
    nome: "Fusível NH"
    atributos_condicionais: [classe_fusivel, tamanho, corrente_nominal, tensao_nominal]
  - codigo: BASE_FUSIVEL_NH
