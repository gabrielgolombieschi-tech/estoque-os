    decisao: "Nome e grupo aprovados para acessório de disjuntor caixa moldada."
  - id: D-002
    data: "2026-08-17"
    status: aprovado
    origem: "Revisão humana da linha Siemens 5SL"
    decisao: "Usar o grupo DISJUNTORES MINI e o formato DISJUNTOR MINI, com corrente e capacidade sem espaço da unidade."
  - id: D-003
    data: "2026-08-17"
    status: aplicado
    origem: "Lote complementar 5SL do fornecedor SIEMENS BRASIL LTDA."
    decisao: "Aplicar a regra D-002 aos itens 5SL com curvas B e C, preservando fabricante e descrição existentes."
  - id: D-004
    data: "2026-08-17"
    status: aprovado
    origem: "Revisão de disjuntores mini WEG e itens equivalentes de outros fornecedores"
    decisao: "Aplicar o nome técnico sem marca, série ou modelo. Preservar fornecedor e fabricante existentes; usar capacidade de interrupção apenas quando confirmada no cadastro."
  - id: D-005
    data: "2026-08-17"
    status: aprovado
    origem: "Revisão humana da família Siemens 5ST"
    decisao: "Classificar blocos de distribuição, barramentos e bornes da família 5ST em DISJUNTORES MINI - ACESSÓRIOS; retirar código, marca e série do nome padronizado."
  - id: D-006
    data: "2026-08-17"
    status: aprovado
    origem: "Definição humana para famílias Siemens 3SB e 3SU"
    decisao: "Classificar botões em Pulsadores, Botões de emergência e Chaves e manoplas seletoras. Omitir front/frontal; registrar iluminação como atributo no nome e manter contatos quando confirmados."
  - id: D-007
    data: "2026-08-17"
    status: aprovado
    origem: "Revisão humana do lote Siemens 3SB e 3SU"
    decisao: "Aplicar os padrões de pulsadores e botões de emergência; botões iluminados permanecem no grupo funcional e declaram iluminação no nome."
  - id: D-008
    data: "2026-08-17"
    status: aprovado
    origem: "Revisão humana dos acessórios e componentes Siemens 3SB e 3SU"
    decisao: "Classificar botoeiras, sinaleiros, blocos de contato, módulos LED e acessórios em grupos funcionais próprios, sem repetir marca, série ou código no nome."
  - id: D-009
    data: "2026-08-17"
    status: aprovado
    origem: "Aplicação aprovada aos fornecedores WEG e Schneider"
    decisao: "Reutilizar os padrões funcionais de comando e sinalização para itens equivalentes de outras marcas, preservando fornecedor e fabricante existentes. Foram normalizados 45 itens: 32 Schneider e 13 WEG."
  - id: D-010
    data: "2026-08-17"
    status: aprovado
    origem: "Revisão humana da classificação de coluna sinalizadora"
    decisao: "Criar o grupo Colunas sinalizadoras, subordinado a Botões de comando, para conjuntos pré-montados de sinalização."
  - id: D-011
    data: "2026-08-17"
    status: aplicado
    origem: "Normalização aprovada da família Siemens de contatores"
    decisao: "Criar Manobra e partida de motores com os grupos Contatores, Contatores auxiliares e Acessórios para contatores. Classificar 64 itens Siemens e normalizar nomes somente com atributos confirmados."
  - id: D-012
    data: "2026-08-17"
    status: aplicado
    origem: "Normalização aprovada da família Siemens 3RV e 3RA"
    decisao: "Criar Proteção e seccionamento com Disjuntores motor e Acessórios para disjuntores motor. Separar conexões 3RA para partida de motores. Classificar 50 itens e normalizar somente correntes/faixas explicitamente confirmadas."
  - id: D-013
    data: "2026-08-17"
    status: aplicado
    origem: "Normalização aprovada da família Siemens 3RU e 3US"
    decisao: "Criar Relés de sobrecarga e Acessórios para relés de sobrecarga. Classificar nove relés e um suporte, preservando somente faixas e tamanhos confirmados."
  - id: D-014
    data: "2026-08-17"
    status: aplicado
    origem: "Revisão humana dos atributos de conexão"
    decisao: "Adicionar conexão por parafuso ou mola aos disjuntores motor e relés de sobrecarga quando confirmada. Manter a referência 3RV1901-1E no bloco auxiliar frontal por compatibilidade técnica aprovada."
  - id: D-015
    data: "2026-08-17"
    status: aplicado
    origem: "Aplicação aprovada aos itens WEG e Schneider equivalentes"
    decisao: "Aplicar os grupos e os formatos técnicos já aprovados a 32 itens: 13 contatores, 1 acessório para contator, 11 disjuntores motor, 2 relés de sobrecarga e 5 acessórios para disjuntores motor. Diferenciar barramentos e terminais por atributos técnicos confirmados, sem inserir marca, série, modelo ou código no nome."
  - id: D-016
    data: "2026-08-17"
    status: aplicado
    origem: "Revisão aprovada de disjuntores caixa moldada Siemens, WEG e Schneider"
    decisao: "Classificar 36 itens entre Disjuntores caixa moldada e Acessórios. Usar medidas compactas nesta família, como 100A, 16kA e 380V. Autorizar modelo e capacidade apenas em manoplas cuja compatibilidade técnica dependa desses dados."
  - id: D-017
    data: "2026-08-17"
    status: aplicado
    origem: "Revisão aprovada de chaves e atuadores de segurança Siemens e equivalentes"
    decisao: "Criar Segurança de máquinas com os grupos Chaves de segurança, Atuadores para chaves de segurança e Acessórios para chaves de segurança. Classificar e normalizar 42 itens: 7 Siemens, 1 Omron, 30 Pizzato e 4 WEG, sem repetir marca, modelo ou código no nome."
  - id: D-018
    data: "2026-08-17"
    status: aplicado
    origem: "Revisão aprovada de relés e módulos de segurança Siemens e equivalentes"
    decisao: "Criar Relés de segurança, Módulos de expansão para relés de segurança, Módulos de segurança para inversores e Módulos de segurança modulares. Classificar e normalizar 24 itens: 11 Siemens de fornecedor direto, 7 Pizzato, 5 WEG e 1 Siemens adquirido por outro fornecedor."
  - id: D-019
    data: "2026-08-17"
    status: aplicado
    origem: "Revisão aprovada de blocos auxiliares frontais Siemens e WEG"
    decisao: "Classificar e normalizar 8 blocos auxiliares frontais em Acessórios para contatores: 7 Siemens e 1 WEG. Preservar somente contatos, tensão e tipo de conexão confirmados."
  - id: D-020
    data: "2026-08-17"
    status: aplicado
    origem: "Revisão aprovada de relés de interface Siemens e Omron"
    decisao: "Criar Relés e monitoramento com Relés de interface e Acessórios para relés de interface. Classificar e normalizar 26 itens: 8 Siemens, 1 Omron, 8 Phoenix e 9 WAGO. Usar o nome funcional mínimo quando faltarem atributos técnicos confirmados."
  - id: D-021
    data: "2026-08-17"
    status: aplicado
    origem: "Aprovação humana do lote de chaves seccionadoras, fusíveis NH, DR, soft-starters, relés de monitoramento e acessórios de relés de segurança"
    decisao: "Criar nove grupos filhos e o grupo Acionamentos de motores. Normalizar 61 itens: 34 Siemens e 27 WEG. Aplicar número e unidade sem espaço em todas as famílias, como 400A, 500VCA e 17,5mm."
  - id: D-022
    data: "2026-08-17"
    status: aplicado
    origem: "Aprovação humana do lote de alimentação, inversores e automação S7-1200"
    decisao: "Criar Alimentação e energia e Automação programável, com dez grupos filhos. Normalizar 71 itens: 35 Siemens e 36 de Schmersal, Omron, Phoenix Contact, Schneider e WEG. Registrar série/família quando necessária para compatibilidade, especialmente S7-1200 e acessórios de inversores."
  - id: D-023
    data: "2026-08-17"
    status: aplicado
    origem: "Aprovação humana do lote Siemens ET200SP, ET200MP e acessórios S7-1500"
    decisao: "Criar onze grupos filhos em Automação programável e normalizar 25 itens Siemens. Usar cabeça de rede para interfaces ET200SP, BusAdapter para adaptadores de barramento, linha SIMATIC DP em acoplador DP/DP e Base final para PLC ET200SP no módulo servidor."
  - id: D-024
    data: "2026-08-17"
    status: aplicado
    origem: "Aprovação humana do lote Siemens de conexões elétricas, transformadores, chaves seccionadoras e relés"
    decisao: "Criar Conexões elétricas com cinco grupos filhos, Transformadores de comando e Relés temporizadores. Classificar 47 itens Siemens e normalizar 43 nomes. Manter quatro transformadores apenas classificados porque a tensão de entrada não foi confirmada em cadastro ou XML fiscal. Usar PENTE, e não PONTE, nos acessórios para bornes."
  - id: D-025
    data: "2026-08-17"
    status: aplicado
    origem: "Aprovação humana do lote final de itens Siemens"
    decisao: "Criar os grupos de servomotores, cabos para servomotores, disjuntores abertos, chaves porta-fusível, controladores e expansões LOGO!, comunicação de PLC, interfaces homem-máquina, pesagem, medição e comunicação industrial. Classificar e normalizar 22 itens Siemens, detalhando compatibilidades, papel de rede, portas e interfaces somente quando confirmados."
