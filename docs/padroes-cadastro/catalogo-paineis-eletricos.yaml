      - "Em redes industriais, switches devem declarar gerenciamento, camada, quantidade, meio e tipo das portas. Módulos de comunicação para PLC declaram família, protocolo e papel de rede quando confirmados."
      - "Módulos de pesagem devem declarar a família de PLC ou a possibilidade de operação autônoma, bem como canal, E/S e interfaces confirmados."
