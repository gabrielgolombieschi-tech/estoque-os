  - curva
  - corrente_nominal
  - capacidade_interrupcao
  - tensao_nominal
  - comprimento

ordem_atributos_nome:
  - tipo_tecnico
  - posicao_montagem
  - equipamento_compativel
  - serie_compativel
  - faixa_nominal_compativel
  - polos
  - curva
  - corrente_nominal
  - capacidade_interrupcao

regras_nome_por_tipo:
  - tipo_tecnico: DISJUNTOR_MINI
    formato: "DISJUNTOR MINI {polos} CURVA {curva} {corrente_nominal} {capacidade_interrupcao_opcional}"
  - tipo_tecnico: BLOCO_DISTRIBUICAO
    formato: "BLOCO DE DISTRIBUIÇÃO {polos} {corrente_nominal} {tensao_nominal}"
  - tipo_tecnico: BARRAMENTO_DISPOSITIVOS_MODULARES
    formato: "BARRAMENTO PARA DISPOSITIVOS MODULARES {polos} {corrente_nominal} {comprimento}"
  - tipo_tecnico: BORNE_BARRAMENTO
    formato: "BORNE [ISOLADO] PARA BARRAMENTO COM CONEXÃO {posicao_montagem} {corrente_nominal_opcional} {tensao_nominal_opcional}"
  - tipo_tecnico: PULSADOR
    formato: "BOTÃO PULSADOR [ILUMINADO] MOMENTÂNEO {diametro_opcional} {material_opcional} {cor_opcional} {tensao_iluminacao_opcional} {contatos_opcional}"
  - tipo_tecnico: BOTAO_EMERGENCIA
    formato: "BOTÃO DE EMERGÊNCIA [ILUMINADO] {diametro_opcional} {material_opcional} {acionamento_opcional} {contatos_opcional}"
  - tipo_tecnico: CHAVE_SELETORA
    formato: "CHAVE SELETORA {numero_posicoes} POSIÇÕES {retorno_opcional} {diametro_opcional} {material_opcional} {cor_opcional} {contatos_opcional}"
  - tipo_tecnico: MANOPLA_SELETORA
    formato: "MANOPLA SELETORA {numero_posicoes} POSIÇÕES {retorno_opcional} {diametro_opcional} {material_opcional} {cor_opcional}"
  - tipo_tecnico: BOTOEIRA_CAIXA_COMANDO
    formato: "BOTOEIRA PARA {aplicacao_ou_quantidade_pontos} {material_opcional} {grau_protecao_opcional}"
  - tipo_tecnico: SINALEIRO
    formato: "SINALEIRO [LED] [MONOBLOCO] {diametro_opcional} {tensao_opcional} {material_opcional} {cor_opcional}"
  - tipo_tecnico: BLOCO_CONTATO_BOTAO
    formato: "BLOCO DE CONTATO {contatos} {funcao_opcional}"
  - tipo_tecnico: MODULO_LED_BOTAO
    formato: "MÓDULO LED {tensao} {cor}"
  - tipo_tecnico: ACESSORIO_BOTAO
    formato: "{tipo_acessorio} PARA BOTÃO {atributos_confirmados_opcionais}"

regras_formatacao:
  caixa: "MAIÚSCULAS"
  unidades: "Número + unidade, sem espaço; exemplos: 100A, 500VCA, 24VCC, 6kA e 17,5mm."
