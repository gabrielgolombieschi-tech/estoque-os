      - "Automação programável > Interfaces homem-máquina"
      - "Medição e instrumentação > Transformadores de corrente"
      - "Comunicação industrial > Switches de rede industrial"
      - "Comunicação industrial > Conectores de rede industrial"
    regras:
      - "Em servoacionamento, declarar família do servomotor e do drive somente quando a compatibilidade estiver confirmada. Cabos de sinal e de potência não são equivalentes."
