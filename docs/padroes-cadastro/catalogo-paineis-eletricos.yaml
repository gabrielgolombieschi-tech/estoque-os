sinonimos_encontrados:
  - termo: "ACION ROT"
    interpretar_como: "ACIONAMENTO ROTATIVO"
    contexto_obrigatorio: "Quando houver evidência de acessório de manobra."
  - termo: "EMERG"
    interpretar_como: "EMERGÊNCIA"
    contexto_obrigatorio: "Quando confirmado como função de emergência."
  - termo: "LAT"
    interpretar_como: "LATERAL"
    contexto_obrigatorio: "Quando indicar a posição de montagem."
  - termo: "DISJ"
    interpretar_como: "DISJUNTOR"
    contexto_obrigatorio: "Quando acompanhado de polos, curva ou corrente nominal."
  - termo: "BLOCO DISTRIBUIÇÃO"
    interpretar_como: "BLOCO DE DISTRIBUIÇÃO"
    contexto_obrigatorio: "Quando indicar bloco para distribuição elétrica."
  - termo: "BORNE TERM"
    interpretar_como: "BORNE PARA BARRAMENTO"
    contexto_obrigatorio: "Quando houver corrente, tensão ou posição de conexão confirmadas."
  - termo: "CONEX. LAT. ESQ."
    interpretar_como: "CONEXÃO LATERAL ESQUERDA"
    contexto_obrigatorio: "Quando indicar a posição do borne no barramento."
  - termo: "CONEX. LAT. DIR."
    interpretar_como: "CONEXÃO LATERAL DIREITA"
    contexto_obrigatorio: "Quando indicar a posição do borne no barramento."
  - termo: "FRONT"
    interpretar_como: "OMITIR DO NOME PADRONIZADO"
    contexto_obrigatorio: "Quando identificar somente a posição frontal do acionador, sem mudar o tipo técnico do botão."
  - termo: "FRONTAL"
    interpretar_como: "OMITIR DO NOME PADRONIZADO"
    contexto_obrigatorio: "Quando identificar somente a posição frontal do acionador, sem mudar o tipo técnico do botão."
  - termo: "RETORNO POR MOLA"
    interpretar_como: "MOMENTÂNEO"
    contexto_obrigatorio: "Quando o retorno mecânico estiver explicitamente informado."
  - termo: "LUMINOSO"
    interpretar_como: "ILUMINADO"
    contexto_obrigatorio: "Quando a iluminação do botão ou do módulo estiver confirmada."

